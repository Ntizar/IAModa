name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el curso generado está al día
        run: |
          python3 -m pip install --quiet markdown==3.10.2
          python3 curso/scripts/build.py
          if [ -n "$(git status --porcelain curso/index.html curso/modulos)" ]; then
            echo "::error::El curso generado no coincide con curso/contenido/. Ejecuta curso/scripts/build.py y commitea."
            git --no-pager diff --stat -- curso
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
